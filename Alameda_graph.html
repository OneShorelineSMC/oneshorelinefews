<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7-Day Tide Forecast – Alameda</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"
  integrity="sha512-WoViKhKD4qI2WruSZqv9+kvM4WfFhUMQCLN4QlDTt5aU56fLQy2gYoxWIqlEnXqJy/+Ac5q/hk1oWfqnMDhwMA=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px 0;
    box-sizing: border-box;
  }
  .card {
    background: white;
    border-radius: 12px;
    padding: 24px 32px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    width: 94%;
    max-width: 1200px;
    box-sizing: border-box;
  }
  h2 {
    margin: 0 0 4px 0;
    font-size: 20px;
    color: #1a3a5c;
  }
  #subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 12px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    font-size: 14px;
    color: #555;
    margin-bottom: 8px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { display: inline-block; width: 22px; height: 0; }
  .sw.meas  { border-top: 3px solid #1e88e5; }
  .sw.tide  { border-top: 3px solid #1a3a5c; }
  .sw.mhhw  { border-top: 2px dashed #e05c2a; }
  .sw.above { width: 14px; height: 12px; background: rgba(192,57,43,0.45); border-top: 3px solid #c0392b; border-radius: 2px; box-sizing: border-box; }
  .sw.now   { width: 0; height: 14px; border-left: 2px solid #888; }
  .chart-wrap { position: relative; height: 340px; }
  #status {
    font-size: 13px;
    color: #aaa;
    margin-top: 10px;
  }
  @media (max-width: 560px) {
    .card { width: auto; margin: 0 10px; padding: 16px 12px; }
    h2 { font-size: 17px; }
    #subtitle, .legend { font-size: 13px; }
    .chart-wrap { height: 280px; }
  }
</style>
</head>
<body>
<div class="card">
  <h2>7-Day Tide Forecast — Alameda</h2>
  <div id="subtitle">NOAA Station 9414750 · Measured and predicted water levels · Datum: MLLW</div>
  <div class="legend">
    <span><i class="sw meas"></i>Measured (past 48 hrs)</span>
    <span><i class="sw tide"></i>Predicted tide</span>
    <span><i class="sw mhhw"></i><span id="mhhwLbl">MHHW</span></span>
    <span><i class="sw above"></i>Above MHHW</span>
    <span><i class="sw now"></i>Now</span>
  </div>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
  <div id="status">Loading…</div>
</div>

<script>
var STATION = "9414750";
var MHHW = 6.60;          // ← MHHW in ft MLLW (NOAA datums)
var DAYS = 7;
var HISTORY_HOURS = 48;      // hours of measured water level shown before "now"
var REFRESH_MINUTES = 6;     // measured levels update every 6 minutes
var PREDICTION_REFRESH_MINUTES = 60;

document.getElementById("mhhwLbl").textContent = "MHHW (" + MHHW.toFixed(2) + " ft)";

/* NOAA returns local station clock times ("2026-10-11 13:16"). We keep them as
   plain clock times (stored as UTC internally) so no time-zone math is needed. */
function parseLocal(s) {
  var a = s.split(/[- :]/).map(Number);
  return Date.UTC(a[0], a[1] - 1, a[2], a[3], a[4]);
}
function nowLocal() {
  var p = {};
  new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Los_Angeles", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23"
  }).formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
}
function ymd(ms) {
  var d = new Date(ms);
  return d.getUTCFullYear() + String(d.getUTCMonth() + 1).padStart(2, "0") + String(d.getUTCDate()).padStart(2, "0");
}
function fmt(ms, opts) {
  return new Date(ms).toLocaleString("en-US", Object.assign({ timeZone: "UTC" }, opts));
}

var chart = null;
var narrow = function () { return window.innerWidth < 560; };

// Draws the vertical "Now" line.
var nowLinePlugin = {
  id: "nowLine",
  afterDatasetsDraw: function (c) {
    var x = c.options.plugins.nowLine.x;
    if (x == null) return;
    var xs = c.scales.x, ys = c.scales.y;
    if (x < xs.min || x > xs.max) return;
    var px = xs.getPixelForValue(x), ctx = c.ctx;
    ctx.save();
    ctx.strokeStyle = "#888";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, ys.top); ctx.lineTo(px, ys.bottom); ctx.stroke();
    ctx.fillStyle = "#666";
    ctx.font = "12px Arial";
    ctx.textAlign = px > xs.right - 40 ? "right" : "left";
    ctx.fillText("Now", px + (ctx.textAlign === "left" ? 4 : -4), ys.top + 12);
    ctx.restore();
  }
};

function draw(preds, obs, startMs, now) {
  // x = hours since midnight today (negative = the past)
  var pts = preds.map(function (p) {
    return { x: (parseLocal(p.t) - startMs) / 3600000, y: parseFloat(p.v) };
  }).filter(function (p) { return !isNaN(p.y); });
  var mhhwPts = pts.map(function (p) { return { x: p.x, y: MHHW }; });
  var abovePts = pts.map(function (p) { return { x: p.x, y: Math.max(p.y, MHHW) }; });

  var obsPts = obs.map(function (p) {
    return { x: (parseLocal(p.t) - startMs) / 3600000, y: parseFloat(p.v) };
  }).filter(function (p) { return !isNaN(p.y) && p.x >= -HISTORY_HOURS; });

  var ys = pts.map(function (p) { return p.y; }).concat(obsPts.map(function (p) { return p.y; }));
  var yMin = Math.floor(Math.min.apply(null, ys) - 0.3);
  var yMax = Math.ceil(Math.max(Math.max.apply(null, ys), MHHW) + 0.3);
  var nowX = (now - startMs) / 3600000;

  var config = {
    type: "line",
    data: {
      datasets: [
        {
          label: "MHHW",
          data: mhhwPts,
          borderColor: "#e05c2a",
          borderWidth: 2,
          borderDash: [6, 4],
          pointRadius: 0,
          pointHoverRadius: 0,
          fill: false,
          order: 2
        },
        {
          // Invisible series = the tide where it's above MHHW, MHHW elsewhere.
          // Filling it down to the MHHW line shades the "above MHHW" areas red.
          label: "Above MHHW",
          data: abovePts,
          borderColor: "rgba(0,0,0,0)",
          backgroundColor: "rgba(192,57,43,0.45)",
          borderWidth: 0,
          pointRadius: 0,
          pointHoverRadius: 0,
          tension: 0.3,
          fill: 0,
          order: 3
        },
        {
          label: "Predicted tide",
          data: pts,
          borderColor: "#1a3a5c",
          borderWidth: 2,
          // Line turns red while the tide is above MHHW.
          segment: {
            borderColor: function (c) {
              return (c.p0.parsed.y > MHHW && c.p1.parsed.y > MHHW) ? "#c0392b" : undefined;
            },
            borderWidth: function (c) {
              return (c.p0.parsed.y > MHHW && c.p1.parsed.y > MHHW) ? 3 : undefined;
            }
          },
          pointRadius: 0,
          pointHoverRadius: 4,
          tension: 0.3,
          fill: false,
          order: 1
        },
        {
          label: "Measured",
          data: obsPts,
          borderColor: "#1e88e5",
          borderWidth: 3,
          pointRadius: 0,
          pointHoverRadius: 4,
          tension: 0.2,
          fill: false,
          order: 0
        }
      ]
    },
    plugins: [nowLinePlugin],
    options: {
      responsive: true,
      maintainAspectRatio: false,          // the CSS height controls the chart height
      animation: false,
      interaction: { intersect: false, mode: "nearest", axis: "x" },
      layout: { padding: { right: 4 } },
      plugins: {
        legend: { display: false },        // HTML legend above the chart
        nowLine: { x: nowX },
        tooltip: {
          filter: function (item) { return item.datasetIndex === 2 || item.datasetIndex === 3; },
          callbacks: {
            title: function (items) {
              var ms = startMs + items[0].parsed.x * 3600000;
              return fmt(ms, { weekday: "short", month: "short", day: "numeric" }) + ", " +
                     fmt(ms, { hour: "numeric", minute: "2-digit" });
            },
            label: function (item) {
              var v = item.parsed.y, d = v - MHHW;
              return (item.datasetIndex === 3 ? "Measured: " : "Predicted: ") + v.toFixed(2) + " ft (" +
                     Math.abs(d).toFixed(2) + " ft " + (d > 0 ? "above" : "below") + " MHHW)";
            }
          }
        }
      },
      scales: {
        x: {
          type: "linear",
          min: -HISTORY_HOURS,
          max: DAYS * 24,
          ticks: {
            stepSize: 12,
            autoSkip: false,
            maxRotation: 0,
            font: { size: narrow() ? 11 : 13 },
            // Day name centered under each day (at noon); nothing at midnight.
            callback: function (v) {
              if (((v % 24) + 24) % 24 !== 12) return "";
              var ms = startMs + v * 3600000;
              return narrow() ? fmt(ms, { weekday: "short" })
                              : fmt(ms, { weekday: "short", month: "numeric", day: "numeric" });
            }
          },
          grid: {
            // Grid lines only at midnight, to separate the days.
            color: function (c) { return c.tick && ((c.tick.value % 24) + 24) % 24 === 0 ? "#e3e8ee" : "rgba(0,0,0,0)"; },
            drawTicks: false
          }
        },
        y: {
          min: yMin,
          max: yMax,
          title: { display: !narrow(), text: "Tide height (ft MLLW)", color: "#888" },
          ticks: {
            stepSize: narrow() ? 2 : 1,
            font: { size: narrow() ? 11 : 13 },
            callback: function (v) { return v + " ft"; }
          },
          grid: { color: "#f0f2f5" }
        }
      }
    }
  };

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), config);
}

function noaaUrl(product, begin, end) {
  return "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter"
    + "?product=" + product
    + "&station=" + STATION
    + "&begin_date=" + begin
    + "&end_date=" + end
    + "&datum=MLLW"
    + "&time_zone=lst_ldt"
    + "&units=english"
    + "&format=json"
    + "&application=OneShorelineFEWS";
}
function getJSON(url) {
  return fetch(url, { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j.error) throw new Error(j.error.message); return j; });
}

var predCache = null, predLoadedAt = 0, predDay = "";
function load() {
  var now = nowLocal();
  var d = new Date(now);
  var startMs = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  var endMs = startMs + DAYS * 86400000;
  var histStart = now - HISTORY_HOURS * 3600000;

  // 6-minute predictions (from the start of the measured history) so short spells above MHHW
  // aren't missed; refreshed hourly. Measured water levels refresh every time.
  var needPred = !predCache || Date.now() - predLoadedAt > PREDICTION_REFRESH_MINUTES * 60000 || predDay !== ymd(now);
  var predP = needPred
    ? getJSON(noaaUrl("predictions", ymd(histStart), ymd(endMs - 1))).then(function (j) {
        predCache = j.predictions || []; predLoadedAt = Date.now(); predDay = ymd(now); return predCache;
      })
    : Promise.resolve(predCache);
  var obsP = getJSON(noaaUrl("water_level", ymd(histStart), ymd(now)))
    .then(function (j) { return j.data || []; })
    .catch(function () { return null; });          // a gauge outage shouldn't hide the predictions

  Promise.all([predP, obsP]).then(function (res) {
    var obs = res[1] || [];
    draw(res[0], obs, startMs, now);
    var last = obs.length ? obs[obs.length - 1] : null;
    document.getElementById("status").textContent =
      (last ? "Latest measurement " + fmt(parseLocal(last.t), { hour: "numeric", minute: "2-digit" }) + " · "
            : (res[1] === null ? "Measured water levels unavailable · " : "")) +
      "Predictions through " + fmt(endMs - 1, { weekday: "short", month: "short", day: "numeric" }) +
      " · Updated " + fmt(nowLocal(), { hour: "numeric", minute: "2-digit" });
  }).catch(function (e) {
    if (!chart) document.getElementById("status").textContent = "Couldn't load NOAA tide predictions (" + e.message + "). Retrying automatically.";
  });
}

load();
setInterval(load, REFRESH_MINUTES * 60000);

// Redraw with the right label sizes if the widget is resized (e.g. phone rotated).
var lastNarrow = narrow();
window.addEventListener("resize", function () {
  if (narrow() !== lastNarrow) { lastNarrow = narrow(); load(); }
});
</script>
</body>
</html>

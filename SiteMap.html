<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A5587">
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<title>OneShoreline Sensor Map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
  crossorigin="anonymous" referrerpolicy="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root {
    --bg: #f0f4f8; --card: #ffffff; --ink: #003B5C; --muted: #66768a; --line: #e3e8ee; --brand: #0A5587;
    --ok: #2e7d32; --l1: #e6c200; --l2: #e07b00; --l3: #c62828; --off: #8a96a3; --rain: #1e6fd9; --slink: #0A5587;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1319; --card: #18202a; --ink: #e6edf5; --muted: #9aa8b8; --line: #2a3542; --rain: #6ea8fe; --slink: #8ec0ff; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }

  header { background: var(--brand); color: #fff; padding: calc(8px + env(safe-area-inset-top)) 14px 8px; flex: none; }
  .hrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { font-size: 18px; margin: 0; }
  .hmark { width: 34px; height: 34px; flex: none; }
  .htitle { display: flex; align-items: center; gap: 10px; min-width: 0; }
  /* Bottom nav (same as the creek page) */
  nav { flex: none; display: flex; background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); z-index: 1500; }
  nav a { flex: 1; min-width: 0; text-decoration: none; font-size: 13px; color: var(--muted); padding: 8px 0 10px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav a .i { font-size: 21px; line-height: 1.1; }
  nav a.on { color: var(--ink); font-weight: bold; }
  #sub { font-size: 12.5px; opacity: .85; margin-top: 2px; }
  .seg { display: flex; background: rgba(255,255,255,.18); border-radius: 9px; padding: 2px; flex: none; }
  .seg button { border: 0; background: none; color: #fff; font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: #fff; color: var(--brand); font-weight: 600; }

  #legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 14px; font-size: 12px; color: var(--muted);
    background: var(--card); border-bottom: 1px solid var(--line); flex: none; }
  #legend span { white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .ld { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); display: inline-block; }
  .ld.sq { border-radius: 2px; }

  #main { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; background: #dfe7ee; }
  .leaflet-control-attribution a { text-decoration: underline; }   /* links in text need more than color (WCAG 1.4.1) */
  #list { position: absolute; inset: 0; z-index: 1200; background: var(--bg); overflow-y: auto; display: none; padding: 10px 12px 24px; }
  #list.show { display: block; }

  /* markers */
  .mk { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .mk.sq { border-radius: 4px; }
  .mk.big { width: 24px; height: 24px; }
  .mk.sel { outline: 3px solid var(--brand); outline-offset: 2px; }
  .rl { font-size: 11px; font-weight: 700; color: #0d47a1; background: rgba(255,255,255,.92); border-radius: 4px;
    padding: 0 3px; white-space: nowrap; position: absolute; top: 19px; left: 50%; transform: translateX(-50%);
    box-shadow: 0 0 2px rgba(0,0,0,.3); }
  .leaflet-container .leaflet-control-attribution { font-size: 10px; }
  .mapbtn { position: absolute; z-index: 1000; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .mapbtn button { border: 0; background: var(--card); color: var(--ink); font: inherit; font-size: 13px; padding: 7px 10px;
    border-radius: 8px; box-shadow: 0 1px 5px rgba(0,0,0,.3); cursor: pointer; }
  .mapbtn button.on { background: var(--rain); color: #fff; }
  .mapbtn #wsBtn[aria-pressed="true"] { background: #2f6b3a; color: #fff; }
  /* Rain totals switch: Off | 1 h | 3 h | 6 h | 24 h (the labels on the map show the chosen window) */
  .rwin { display: flex; align-items: center; background: var(--card); border-radius: 8px; box-shadow: 0 1px 5px rgba(0,0,0,.3); overflow: hidden; }
  .rwin .rwl { font-size: 13px; font-weight: 700; color: var(--ink); padding: 0 6px 0 10px; }
  .mapbtn .rwin button { box-shadow: none; border-radius: 0; padding: 7px 8px; min-width: 36px; min-height: 32px; }
  .mapbtn .rwin button[aria-pressed="true"] { background: var(--rain); color: #fff; font-weight: 700; }
  @media (prefers-color-scheme: dark) { .mapbtn .rwin button[aria-pressed="true"], .mapbtn button.on { color: #0e1319; } }   /* dark text on the light blue */
  .rwins { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 14px; margin-top: 2px; } .rwins b { font-size: 15px; }

  /* site card */
  #sheet { position: absolute; z-index: 1100; left: 0; right: 0; bottom: 0; max-height: 62%; overflow-y: auto;
    background: var(--card); border-radius: 16px 16px 0 0; box-shadow: 0 -4px 18px rgba(0,0,0,.25);
    padding: 6px 16px calc(14px + env(safe-area-inset-bottom)); transform: translateY(105%); visibility: hidden;
    transition: transform .22s, visibility .22s; }
  #sheet.show { transform: none; visibility: visible; }
  @media (min-width: 760px) {
    #sheet { left: 12px; right: auto; top: 12px; bottom: auto; width: 380px; max-height: calc(100% - 24px);
      border-radius: 14px; transform: translateX(-110%); }
  }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 8px; }
  .shead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .sname { font-size: 18px; font-weight: 700; line-height: 1.25; }
  .snum { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .x { border: 0; background: var(--bg); color: var(--ink); font-size: 18px; width: 34px; height: 34px; border-radius: 50%; flex: none; cursor: pointer; }
  .badge { display: inline-block; font-size: 12.5px; font-weight: 700; color: #fff; border-radius: 6px; padding: 3px 8px; margin-top: 8px; }
  .sens { border-top: 1px solid var(--line); padding: 10px 0 6px; }
  .sens:first-of-type { border-top: 0; }
  .srow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .slbl { font-size: 14px; font-weight: 600; }
  .sval { font-size: 22px; font-weight: 700; white-space: nowrap; }
  .sval small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 2px; }
  .sage { font-size: 12.5px; color: var(--muted); }
  .sage.old { color: #a35200; }
  @media (prefers-color-scheme: dark) { .sage.old { color: #f0a050; } }
  .lvl { font-size: 12.5px; font-weight: 700; }
  canvas.spark { width: 100%; height: 54px; display: block; margin-top: 6px; }
  .glbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .olink { display: block; text-align: center; margin: 12px 0 4px; padding: 11px; border-radius: 10px; background: var(--brand);
    color: #fff; text-decoration: none; font-weight: 600; font-size: 15px; }
  .olink.sec { background: none; color: var(--slink); text-decoration: underline; font-weight: 600; font-size: 14px; padding: 8px; margin-top: 6px; }
  .clink { display: block; margin: 10px 0 0; padding: 11px 14px; border-radius: 10px; background: var(--brand); color: #fff;
    text-decoration: none; font-weight: 700; font-size: 15.5px; }
  .clink + .clink { margin-top: 6px; }
  .clink:focus-visible, .olink:focus-visible { outline: 3px solid #1e6fd9; outline-offset: 2px; }
  .fine { font-size: 11.5px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
  .fine a { color: inherit; }

  /* list */
  .grp { font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 12px 4px 6px; }
  .row { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 10px; padding: 10px 12px;
    margin-bottom: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: pointer; }
  .row .ld { flex: none; width: 13px; height: 13px; }
  .rmain { flex: 1; min-width: 0; }
  .rname { font-size: 15px; font-weight: 600; }
  .rvals { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .rage { font-size: 12px; color: var(--muted); text-align: right; flex: none; }
  #msg { position: absolute; z-index: 1300; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--card);
    padding: 12px 16px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.2); font-size: 14px; text-align: center; max-width: 85%; }
  /* flood reports (staff-approved, from community_flood_reports.json) */
  .rp { width: 16px; height: 16px; background: #8A3B12; border: 2.5px solid #fff; border-radius: 3px; transform: rotate(45deg);
    box-shadow: 0 1px 4px rgba(0,0,0,.45); margin: 2px; }
  .rp.sel { outline: 3px solid var(--brand); outline-offset: 2px; }
  .ld.rpd { border-radius: 2px; transform: rotate(45deg) scale(.85); background: #8A3B12; }
  .mapbtn button.rpon { background: #8A3B12; color: #fff; }
  #legend #rpnote { display: none; flex-basis: 100%; white-space: normal; }
  #legend #rpnote.show { display: block; }
  .rphoto { display: block; width: 100%; max-height: 260px; object-fit: cover; border-radius: 10px; margin-top: 10px; background: var(--line); }
  .rsum { font-size: 15px; margin-top: 10px; line-height: 1.45; }
  #listfoot { font-size: 12px; color: var(--muted); margin: 18px 4px 0; line-height: 1.45; }
  #listfoot a { color: inherit; }
</style>
</head>

<header>
  <div class="hrow">
    <div class="htitle"><img class="hmark" src="img/oneshoreline-mark-white.png" alt="OneShoreline" width="34" height="34"><div>
      <h1>Sensor Map</h1>

<div id="legend">
  <span><i class="ld" style="background:var(--ok)"></i>Reporting</span>

  <span><i class="ld" style="background:var(--l3)"></i>Warning</span>

      <span class="rwl" aria-hidden="true">Rain</span><button data-w="0" aria-pressed="true">Off</button><button data-w="1" aria-pressed="false" aria-label="1 hour">1 h</button><button data-w="3" aria-pressed="false" aria-label="3 hours">3 h</button><button data-w="6" aria-pressed="false" aria-label="6 hours">6 h</button><button data-w="24" aria-pressed="false" aria-label="24 hours">24 h</button></div>

<script src="lookups.js?v=20261017c"></script>
<script>
/* ===================== CONFIG ===================== */
// Published every 15 minutes by the GitHub Action (.github/workflows/onerain.yml, scripts/fetch_sites.py)
var SITES_URL = "https://raw.githubusercontent.com/OneShorelineSMC/oneshorelinefews/data/sites.json";
var REFRESH_MIN = 5;              // how often the page checks for new data
// From lookups/settings.csv (through lookups.js): SITE_QUIET_HOURS = a site is "not reporting" when no sensor has
// reported for this long; SITE_OLD_READING_HOURS = readings older than this are orange; SITE_DATA_LATE_MIN = warn
// when the published file itself is older than this.
var LK = window.LOOKUPS, NOT_REPORTING_HOURS, OLD_READING_HOURS, DATA_LATE_MIN;
function applyLookups() { NOT_REPORTING_HOURS = LK.num("SITE_QUIET_HOURS"); OLD_READING_HOURS = LK.num("SITE_OLD_READING_HOURS"); DATA_LATE_MIN = LK.num("SITE_DATA_LATE_MIN"); }
applyLookups();
var CREEK_PAGE = "Creeks.html";
// Flood reports approved by staff (scripts/fetch_community_flood_reports.py): shown when REPORTS_PUBLIC = 1, or in the staff preview
var REPORTS_BASE = "https://raw.githubusercontent.com/OneShorelineSMC/oneshorelinefews/data/";
var PREVIEW = /[?&]preview=1\b/.test(location.search);
var DISCLAIMER_URL = "Creeks.html#about";
/* ================================================== */

var params = new URLSearchParams(location.search);
// ?data= (testing only) may name a file on this site, never another website: a shared link can't show fake readings
if (/^[\w-]+(\/[\w-]+)*\.json$/.test(params.get("data") || "")) SITES_URL = params.get("data");
var LEVEL_COLORS = ["var(--ok)", "var(--l1)", "var(--l2)", "var(--l3)"];
var LEVEL_HEX = ["#2e7d32", "#e6c200", "#e07b00", "#c62828", "#9c27b0"];
var LEVEL_NAMES = ["Normal", "Flood Monitoring", "Flood Watch", "Flood Warning", "Above Flood Warning"];
// The name a gauge gives a level (e.g. "Roadway Flooded"), falling back to the standard names
function levelName(sensors, level) {
  var n = null;
  sensors.forEach(function (s) { (s.thresholds || []).forEach(function (t) { if (t.level === level) n = n || t.name; }); });
  return n || LEVEL_NAMES[level];
}

/* ---------- time helpers: OneRain times are Pacific wall-clock "YYYY-MM-DD HH:MM" ---------- */
function parseLocal(s) { var m = s.match(/(\d+)-(\d+)-(\d+)[ T](\d+):(\d+)/); return Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5]); }
function nowLocal() {
  var p = {}; new Intl.DateTimeFormat("en-US", { timeZone: "America/Los_Angeles", hourCycle: "h23",
    year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", second: "numeric" })
    .formatToParts(new Date()).forEach(function (x) { p[x.type] = +x.value; });
  return Date.UTC(p.year, p.month - 1, p.day, p.hour % 24, p.minute, p.second);
}
function ago(ms) {
  var m = Math.max(0, Math.round(ms / 60000));
  if (m < 2) return "just now";
  if (m < 60) return m + " min ago";
  var h = m / 60;
  if (h < 36) return Math.round(h) + (Math.round(h) === 1 ? " hr ago" : " hrs ago");
  return Math.round(h / 24) + " days ago";
}
function fClock(ms) {
  var d = new Date(ms), h = d.getUTCHours(), mi = d.getUTCMinutes();
  return (h % 12 || 12) + ":" + String(mi).padStart(2, "0") + (h < 12 ? " AM" : " PM");
}
function fWhen(ms) {
  var today = Math.floor(nowLocal() / 864e5), day = Math.floor(ms / 864e5);
  if (day === today) return fClock(ms);
  return new Date(ms).toLocaleDateString("en-US", { timeZone: "UTC", month: "short", day: "numeric" }) + ", " + fClock(ms);
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function num(v, unit) {
  if (v == null) return "–";
  var d = Math.abs(v) >= 100 ? 0 : (unit === "in" ? 2 : (Math.abs(v) >= 10 ? 1 : 2));
  return v.toFixed(d);
}

/* ---------- status ---------- */
function sensorLevel(s, now) {
  if (!s.thresholds || s.value == null || !s.time) return 0;
  if (now - parseLocal(s.time) > NOT_REPORTING_HOURS * 36e5) return 0;
  var lvl = 0;
  s.thresholds.forEach(function (t) { if (s.value >= t.value) lvl = Math.max(lvl, t.level); });
  return lvl;
}
function siteStatus(site, now) {
  var newest = 0, level = 0, rain = null, rainOnly = true;
  site.sensors.forEach(function (s) {
    if (s.time) newest = Math.max(newest, parseLocal(s.time));
    level = Math.max(level, sensorLevel(s, now));
    if (s.kind === "increment" || s.kind === "accumulation") { var r = rainOver(s, rainWin || 24); if (r != null) rain = Math.max(rain || 0, r); }
    else rainOnly = false;
  });
  var off = !newest || now - newest > NOT_REPORTING_HOURS * 36e5;
  return { level: level, off: off, newest: newest, rain: rain, rainOnly: rainOnly,
    color: off ? "#8a96a3" : LEVEL_HEX[level], label: off ? "Not reporting" : levelName(site.sensors, level) };
}

/* ---------- map ---------- */
var map = L.map("map", { zoomControl: false, attributionControl: true }).setView([37.5, -122.3], 10);
L.control.zoom({ position: "bottomright" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
map.attributionControl.setPrefix(false);

var DATA = null, markers = {}, selected = null, showRain = false, rainWin = 0, firstFit = true, autoRain = false;   // rainWin: 1, 3, 6 or 24 hours; 0 = off
// A rain sensor's total over the last h hours (rain1 / rain3 / rain6 / rain24 from the data job; older files: from the hourly bars)
function rainOver(s, h) {
  if (s["rain" + h] != null) return s["rain" + h];
  if (h === 24 || !s.hourly || !s.hourly.length) return h === 24 ? s.rain24 : null;
  var now = nowLocal(), t0 = now - h * 36e5, sum = 0;
  s.hourly.forEach(function (x) { var t = parseLocal(x[0]); if (t + 36e5 > t0) sum += x[1]; });
  return Math.round(sum * 100) / 100;
}

function markerIcon(site, st) {
  var big = st.level > 0 && !st.off;
  var label = (showRain && st.rain != null) ? '<span class="rl">' + st.rain.toFixed(2) + '″</span>' : "";
  return L.divIcon({ className: "", iconSize: big ? [24, 24] : [18, 18], iconAnchor: big ? [12, 12] : [9, 9],
    html: '<div class="mk' + (st.rainOnly ? " sq" : "") + (big ? " big" : "") + (selected === site.site ? " sel" : "") +
      '" style="background:' + st.color + '"></div>' + label });
}

function draw() {
  if (!DATA) return;
  var now = nowLocal(), bounds = [];
  Object.keys(markers).forEach(function (k) { map.removeLayer(markers[k]); });
  markers = {};
  // Draw calm sites first so alerts sit on top
  var sites = DATA.sites.slice().sort(function (a, b) { return rank(a, now) - rank(b, now); });
  sites.forEach(function (site) {
    var st = siteStatus(site, now);
    var m = L.marker([site.lat, site.lon], { icon: markerIcon(site, st), title: site.name, riseOnHover: true,
      zIndexOffset: st.off ? -500 : st.level * 500 + (selected === site.site ? 2000 : 0) });
    m.on("click", function () { openSite(site.site, false); });
    m.bindTooltip(esc(site.name), { direction: "top", offset: [0, -10] });   // tooltips are HTML: escape the OneRain name
    m.addTo(map); markers[site.site] = m; bounds.push([site.lat, site.lon]);
  });
  if (firstFit && bounds.length) { map.fitBounds(bounds, { padding: [24, 24] }); firstFit = false; }
  drawReports();
  drawList(now);
  if (selected) renderSheet(selected);
  else if (selectedReport) renderReport(selectedReport);
}
function rank(site, now) { var st = siteStatus(site, now); return st.off ? -1 : st.level; }

/* ---------- site card ---------- */
function openSite(id, fly) {
  selected = id; selectedReport = null;
  var site = DATA.sites.find(function (s) { return s.site === id; });
  if (!site) return;
  setView("map");
  draw();
  document.getElementById("sheet").classList.add("show");
  if (fly) map.setView([site.lat, site.lon], Math.max(map.getZoom(), 12));
  else map.panTo([site.lat, site.lon]);
  history.replaceState(null, "", "#site=" + encodeURIComponent(site.number || site.site_id));
}
// Badge text must be readable on the marker color (WCAG 4.5:1): darker gray for "not reporting", dark text on yellow
function badgeStyle(c) {
  var m = { "#8a96a3": "#5f6b78", "#e07b00": "#a35200", "#2e7d32": "#2e7d32", "#c62828": "#c62828" };
  if (/^#e6c200$/i.test(c)) return "background:#e6c200;color:#1a1a1a";
  return "background:" + (m[String(c).toLowerCase()] || c);
}
function closeSite() {
  selected = null; selectedReport = null;
  document.getElementById("sheet").classList.remove("show");
  history.replaceState(null, "", location.pathname + location.search);
  draw();
}
function renderSheet(id) {
  var site = DATA.sites.find(function (s) { return s.site === id; });
  if (!site) return;
  var now = nowLocal(), st = siteStatus(site, now);
  var h = '<div class="grab"></div><div class="shead"><div><div class="sname">' + esc(site.name) + '</div>' +
    '<div class="snum">Site ' + esc(site.number) + '</div></div><button class="x" aria-label="Close" onclick="closeSite()">✕</button></div>' +
    '<span class="badge" style="' + badgeStyle(st.color) + '">' + esc(st.label) + '</span>' +
    // the creek page first (status, what to do, rising fast, tide, triggers); a rain gauge that only feeds a creek's status says so
    (site.creeks || []).map(function (c) {
      return '<a class="clink" href="' + CREEK_PAGE + (PREVIEW ? "?preview=1" : "") + "#" + encodeURIComponent(c.id) + '">' +
        (c.role === "support" ? "Counts toward " + esc(c.name) : esc(c.name) + " conditions") + " ›</a>";
    }).join("");
  site.sensors.forEach(function (s, i) {
    var t = s.time ? parseLocal(s.time) : null, old = t && now - t > OLD_READING_HOURS * 36e5;
    var lvl = sensorLevel(s, now), rainish = s.kind === "increment" || s.kind === "accumulation";
    h += '<div class="sens"><div class="srow"><div class="slbl">' + esc(s.name) + '</div>';
    if (rainish && s.rain24 != null) {
      h += '<div class="sval">' + s.rain24.toFixed(2) + '<small>in / 24 h</small></div></div>';
      h += '<div class="rwins">' + [1, 3, 6, 24].map(function (w) { var r = rainOver(s, w); return r == null ? "" : "<span>" + w + " h <b>" + r.toFixed(2) + "</b></span>"; }).join("") + " <span>in</span></div>";
      h += '<div class="sage' + (old ? " old" : "") + '">' + (t ? "last report " + ago(now - t) : "no recent report") + '</div>';
    } else {
      h += '<div class="sval">' + num(s.value, s.unit) + '<small>' + esc(s.unit) + '</small></div></div>';
      h += '<div class="sage' + (old ? " old" : "") + '">' + (t ? fWhen(t) + " · " + ago(now - t) : "no recent report") + '</div>';
    }
    if (s.thresholds) {
      h += '<div class="lvl" style="color:' + (lvl ? LEVEL_HEX[lvl] : "var(--muted)") + '">' + (lvl ? levelName([s], lvl) + " level · " : "") +
        s.thresholds.map(function (x) { return x.name.replace(/^Flood | Flood Stage$/g, "") + " " + x.value; }).join(" · ") + " " + esc(s.unit) + '</div>';
    }
    if ((s.points && s.points.length > 1) || (s.hourly && s.hourly.length)) {
      h += '<canvas class="spark" id="sp' + i + '"></canvas><div class="glbl"><span>24 hours ago</span><span>' +
        (s.hourly ? "rain per hour" : "") + '</span><span>now</span></div>';
    }
    h += '</div>';
  });
  h += '<a class="olink' + ((site.creeks || []).length ? " sec" : "") + '" href="' + esc(site.url) + '" target="_blank" rel="noopener">Full data on OneRain ↗</a>' +
    '<div class="fine">' + esc(LK.text("disclaimer_short_map")) + ' ' +
    '<a href="' + DISCLAIMER_URL + '">Disclaimer</a> · ' + esc(LK.text("e911")) + '</div>';
  var sh = document.getElementById("sheet");
  sh.innerHTML = h;
  site.sensors.forEach(function (s, i) { var c = document.getElementById("sp" + i); if (c) spark(c, s, now); });
}

/* small graph: last 24 h, line for levels, hourly bars for rain */
function spark(c, s, now) {
  var dpr = window.devicePixelRatio || 1, w = c.clientWidth, hgt = c.clientHeight;
  c.width = w * dpr; c.height = hgt * dpr;
  var g = c.getContext("2d"); g.scale(dpr, dpr);
  var t0 = now - 24 * 36e5, x = function (t) { return (t - t0) / (24 * 36e5) * (w - 2) + 1; };
  var css = getComputedStyle(document.documentElement);
  g.strokeStyle = css.getPropertyValue("--line"); g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, hgt - .5); g.lineTo(w, hgt - .5); g.stroke();
  if (s.hourly) {
    var max = Math.max(0.1, Math.max.apply(null, s.hourly.map(function (p) { return p[1]; })));
    g.fillStyle = css.getPropertyValue("--rain").trim() || "#1e6fd9";
    s.hourly.forEach(function (p) {
      var t = parseLocal(p[0]); if (t < t0) return;
      var bh = p[1] / max * (hgt - 4), bw = Math.max(2, (w / 24) - 2);
      g.fillRect(x(t) + 1, hgt - bh, bw, bh);
    });
    g.fillStyle = css.getPropertyValue("--muted"); g.font = "10px sans-serif"; g.textAlign = "left";
    g.fillText("max " + max.toFixed(2) + " in/hr", 2, 10);
    return;
  }
  var pts = s.points.map(function (p) { return [parseLocal(p[0]), p[1]]; }).filter(function (p) { return p[0] >= t0; });
  if (pts.length < 2) return;
  var vals = pts.map(function (p) { return p[1]; }), lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  (s.thresholds || []).forEach(function (t) { if (t.value <= hi * 1.25 + 0.2) hi = Math.max(hi, t.value); });
  if (hi - lo < 0.2) { hi += 0.1; lo -= 0.1; }
  var pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  var y = function (v) { return hgt - 2 - (v - lo) / (hi - lo) * (hgt - 4); };
  (s.thresholds || []).forEach(function (t) {
    if (t.value > hi || t.value < lo) return;
    g.strokeStyle = LEVEL_HEX[t.level]; g.setLineDash([4, 3]); g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(0, y(t.value)); g.lineTo(w, y(t.value)); g.stroke();
  });
  g.setLineDash([]); g.strokeStyle = "#1e88e5"; g.lineWidth = 2; g.lineJoin = "round";
  g.beginPath();
  pts.forEach(function (p, i) { if (i) g.lineTo(x(p[0]), y(p[1])); else g.moveTo(x(p[0]), y(p[1])); });
  g.stroke();
  g.font = "10px sans-serif"; g.lineWidth = 3; g.strokeStyle = css.getPropertyValue("--card");
  g.fillStyle = css.getPropertyValue("--muted");
  [[num(Math.max.apply(null, vals), s.unit), 10], [num(Math.min.apply(null, vals), s.unit), hgt - 4]].forEach(function (l) {
    g.strokeText(l[0], 2, l[1]); g.fillText(l[0], 2, l[1]);
  });
}

/* ---------- list ---------- */
function drawList(now) {
  var groups = [[], [], []];   // alerts, reporting, not reporting
  DATA.sites.forEach(function (site) {
    var st = siteStatus(site, now);
    groups[st.off ? 2 : (st.level ? 0 : 1)].push({ site: site, st: st });
  });
  groups[0].sort(function (a, b) { return b.st.level - a.st.level; });
  var titles = ["At an alert level", "Reporting", "Not reporting in the past " + NOT_REPORTING_HOURS + " hours"];
  var h = "";
  groups.forEach(function (g, gi) {
    if (!g.length) return;
    h += '<div class="grp">' + titles[gi] + " (" + g.length + ")</div>";
    g.forEach(function (o) {
      var site = o.site, vals = site.sensors.slice(0, 3).map(function (s) {
        if ((s.kind === "increment" || s.kind === "accumulation") && s.rain24 != null) {
          var r1 = rainOver(s, 1); return "Rain " + (r1 != null ? r1.toFixed(2) + " in/1 h · " : "") + s.rain24.toFixed(2) + " in/24 h"; }
        return esc(s.name) + " " + num(s.value, s.unit) + " " + esc(s.unit);
      }).join(" · ");
      h += '<div class="row" data-id="' + esc(site.site) + '"><i class="ld' + (o.st.rainOnly ? " sq" : "") + '" style="background:' + o.st.color + '"></i>' +
        '<div class="rmain"><div class="rname">' + esc(site.name) + '</div><div class="rvals">' + vals + '</div></div>' +
        '<div class="rage">' + (o.st.newest ? ago(now - o.st.newest) : "–") + '</div></div>';
    });
  });
  h += '<div id="listfoot">Data from the OneShoreline Early Warning System (OneRain), refreshed about every 15 minutes. ' +
    esc(LK.text("disclaimer_short_map")) + ' ' +
    '<a href="' + DISCLAIMER_URL + '">Disclaimer</a> · <a href="' + CREEK_PAGE + '">Creek conditions</a> · ' + esc(LK.text("e911")) + '</div>';
  var el = document.getElementById("list");
  el.innerHTML = h;
  Array.prototype.forEach.call(el.querySelectorAll(".row"), function (r) {
    r.addEventListener("click", function () { openSite(r.dataset.id, true); });
  });
}

/* ---------- views ---------- */
function setView(v) {
  document.getElementById("list").classList.toggle("show", v === "list");
  document.getElementById("mapbtns").style.display = v === "list" ? "none" : "";
  Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) { b.classList.toggle("on", b.dataset.view === v); });
  if (v === "list") document.getElementById("sheet").classList.remove("show");
  else setTimeout(function () { map.invalidateSize(); }, 0);
}
Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) {
  b.addEventListener("click", function () { setView(b.dataset.view); });
});
function setRainWin(w) {
  rainWin = w; showRain = w > 0;
  Array.prototype.forEach.call(document.querySelectorAll("#rainWin button"), function (b) { b.setAttribute("aria-pressed", String(+b.dataset.w === w)); });
  try { localStorage.setItem("fews_rain_win", String(w)); } catch (e) {}
  draw();
}
Array.prototype.forEach.call(document.querySelectorAll("#rainWin button"), function (b) {
  b.addEventListener("click", function () { setRainWin(+b.dataset.w); });
});
(function () { try { var w = +localStorage.getItem("fews_rain_win"); if ([1, 3, 6, 24].indexOf(w) >= 0) { rainWin = w; showRain = true;
  Array.prototype.forEach.call(document.querySelectorAll("#rainWin button"), function (b) { b.setAttribute("aria-pressed", String(+b.dataset.w === w)); }); } } catch (e) {} })();
/* ---------- Watershed boundaries (USGS WBD subwatersheds, data/watersheds.geojson from .github/workflows/creek_maps.yml).
   Phone map only (not the kiosk). The switch appears once the file exists; the boundaries load on first use. */
var WS = { layer: null, on: false };
fetch("data/watersheds.geojson", { method: "HEAD" }).then(function (r) { if (r.ok) document.getElementById("wsBtn").hidden = false; }).catch(function () {});
document.getElementById("wsBtn").addEventListener("click", function () {
  var b = this; WS.on = !WS.on; b.setAttribute("aria-pressed", String(WS.on));
  if (!WS.on) { if (WS.layer) map.removeLayer(WS.layer); return; }
  if (WS.layer) { WS.layer.addTo(map); return; }
  fetch("data/watersheds.geojson").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (gj) {
    WS.layer = L.geoJSON(gj, {
      style: { color: "#2f6b3a", weight: 1.6, opacity: 0.9, fillColor: "#2f6b3a", fillOpacity: 0.04, dashArray: "5 4" },
      onEachFeature: function (f, l) { if (f.properties && f.properties.name) l.bindTooltip(esc(f.properties.name), { sticky: true }); },
      attribution: "Watersheds: " + (/County/.test(gj.source || "") ? "San Mateo County (C/CAG)" : "USGS")
    });
    if (WS.on) WS.layer.addTo(map);
  }).catch(function () {
    WS.on = false; b.setAttribute("aria-pressed", "false");
    var msg = document.getElementById("msg"); msg.style.display = ""; msg.textContent = "Watershed boundaries couldn't load. Try again later.";
    setTimeout(function () { msg.style.display = "none"; }, 4000);
  });
});
document.getElementById("allBtn").addEventListener("click", function () {
  if (!DATA) return;
  map.fitBounds(DATA.sites.map(function (s) { return [s.lat, s.lon]; }), { padding: [24, 24] });
});
map.on("click", function () { if (selected || selectedReport) closeSite(); });

/* ---------- flood reports ---------- */
var REPORTS = null, showReports = false, reportMarkers = [], selectedReport = null;
var R_TYPES = ["street", "building", "road_closed", "creek", "shoreline", "other"], R_DEPTHS = ["shallow", "ankle_knee", "above_knee", "unknown"];
function reportsEnabled() { return PREVIEW || LK.num("REPORTS_PUBLIC") === 1; }
function loadReports() {
  if (!reportsEnabled()) return Promise.resolve();
  return fetch(REPORTS_BASE + "community_flood_reports.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      REPORTS = (d.reports || []).filter(function (r) {   // only well-formed reports
        return typeof r.lat === "number" && typeof r.lon === "number" && /^\d{4}-\d\d-\d\d \d\d:\d\d$/.test(r.observed || "") &&
          typeof r.id === "string" && /^[0-9a-f]{6,64}$/.test(r.id);
      });
      document.getElementById("rpBtn").hidden = false;
      drawReports();
    })
    .catch(function () { if (REPORTS === null) document.getElementById("rpBtn").hidden = true; });
}
function rText(kind, code, list) { return LK.text("report_" + kind + "_" + (list.indexOf(code) >= 0 ? code : list[list.length - 1])); }
function drawReports() {
  reportMarkers.forEach(function (m) { map.removeLayer(m); });
  reportMarkers = [];
  var on = showReports && REPORTS;
  document.getElementById("rplegend").hidden = !on;
  var note = document.getElementById("rpnote");
  note.classList.toggle("show", !!on);
  if (on) {
    note.textContent = (REPORTS.length ? LK.text("report_map_note") : LK.text("report_none", { days: LK.num("REPORTS_MAX_AGE_DAYS") })) + " ";
    var a = document.createElement("a"); a.href = "CommunityFloodReports.html" + (PREVIEW ? "?preview=1" : ""); a.textContent = LK.text("report_title") + " ›";
    note.appendChild(a);
  }
  if (!on) return;
  REPORTS.forEach(function (r) {
    var sel = selectedReport && selectedReport.id === r.id;
    var m = L.marker([r.lat, r.lon], { icon: L.divIcon({ className: "", iconSize: [22, 22], iconAnchor: [11, 11],
      html: '<div class="rp' + (sel ? " sel" : "") + '"></div>' }), title: rText("type", r.type, R_TYPES), zIndexOffset: sel ? 3000 : 1000 });
    m.on("click", function () { openReport(r); });
    m.addTo(map); reportMarkers.push(m);
  });
}
function openReport(r) {
  selected = null; selectedReport = r;
  setView("map"); draw();
  document.getElementById("sheet").classList.add("show");
  map.panTo([r.lat, r.lon]);
}
// Built from DOM nodes and textContent only: nothing in community_flood_reports.json is treated as HTML
function renderReport(r) {
  var sh = document.getElementById("sheet"), el = function (tag, cls, text) {
    var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  sh.innerHTML = "";
  sh.appendChild(el("div", "grab"));
  var head = el("div", "shead"), t = el("div");
  t.appendChild(el("div", "sname", rText("type", r.type, R_TYPES)));
  t.appendChild(el("div", "snum", LK.text("report_seen", { time: fWhen(parseLocal(r.observed)) }) + " · " + rText("depth", r.depth, R_DEPTHS)));
  head.appendChild(t);
  var x = el("button", "x", "✕"); x.setAttribute("aria-label", "Close"); x.addEventListener("click", closeSite);
  head.appendChild(x); sh.appendChild(head);
  if (r.summary) sh.appendChild(el("div", "rsum", String(r.summary).slice(0, 300)));
  if (typeof r.photo === "string" && /^[0-9a-f]{24}\.jpg$/.test(r.photo)) {
    var img = el("img", "rphoto"); img.src = REPORTS_BASE + "community_flood_reports/" + r.photo; img.alt = "Photo of the flooding, approved by staff";
    img.loading = "lazy"; img.referrerPolicy = "no-referrer"; sh.appendChild(img);
  }
  var a = el("a", "olink", LK.text("report_title")); a.href = "CommunityFloodReports.html" + (PREVIEW ? "?preview=1" : ""); sh.appendChild(a);
  var f = el("div", "fine", LK.text("report_map_note") + " " + LK.text("report_timing"));
  sh.appendChild(f);
}
document.getElementById("rpBtn").addEventListener("click", function () {
  showReports = !showReports; this.classList.toggle("rpon", showReports);
  if (!showReports && selectedReport) closeSite(); else draw();
  if (showReports && REPORTS && REPORTS.length) map.fitBounds(REPORTS.map(function (r) { return [r.lat, r.lon]; }), { padding: [40, 40], maxZoom: 14 });
});

/* ---------- data ---------- */
function load() {
  return fetch(SITES_URL + (SITES_URL.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      DATA = d;
      DATA.sites = (d.sites || []).filter(function (s) { return s.lat != null && s.sensors && s.sensors.length; });
      document.getElementById("msg").style.display = "none";
      var gen = parseLocal(d.generated), late = nowLocal() - gen > DATA_LATE_MIN * 6e4;
      document.getElementById("sub").textContent = DATA.sites.length + " sites · updated " + fWhen(gen) + (late ? " ⚠ data delayed" : "");
      // first visit while it's raining: show the past hour's rain on the map (the viewer's own choice is kept after that)
      var picked = null; try { picked = localStorage.getItem("fews_rain_win"); } catch (e) {}
      if (picked == null && !autoRain && DATA.sites.some(function (x) { return x.sensors.some(function (z) { return (rainOver(z, 1) || 0) >= 0.05; }); })) { autoRain = true; rainWin = 1; showRain = true;
        Array.prototype.forEach.call(document.querySelectorAll("#rainWin button"), function (b) { b.setAttribute("aria-pressed", String(+b.dataset.w === 1)); }); }
      var cm = location.hash.match(/creek=([a-z0-9_-]+)/);
      var cs = cm ? DATA.sites.filter(function (x) { return (x.creeks || []).some(function (c) { return c.id === cm[1]; }); }) : [];
      if (cs.length && firstFit) { firstFit = false; map.fitBounds(cs.map(function (x) { return [x.lat, x.lon]; }), { padding: [60, 60], maxZoom: 13 }); }
      draw();
      var m = location.hash.match(/site=([^&]+)/);
      if (m && !selected) {
        var key = decodeURIComponent(m[1]);
        var s = DATA.sites.find(function (x) { return x.number === key || String(x.site_id) === key; });
        if (s) openSite(s.site, true);
      }
    })
    .catch(function (e) {
      if (!DATA) {
        var msg = document.getElementById("msg");
        msg.style.display = ""; msg.textContent = "Couldn't load the site data. Check your connection and try again.";
      }
      document.getElementById("sub").textContent = "⚠ Couldn't refresh data";
    });
}
load();
// Report tab in the bottom bar: staff preview, or everyone once REPORTS_PUBLIC = 1 (lookups/settings.csv)
function reportNav() {
  var nv = document.querySelector("nav"), pv = /[?&]preview=1\b/.test(location.search), on = pv || LK.num("REPORTS_PUBLIC") === 1;
  if (!nv || !on || nv.querySelector('a[href^="CommunityFloodReports.html"]')) return;
  var a = document.createElement("a"); a.href = "CommunityFloodReports.html" + (pv ? "?preview=1" : "");
  a.innerHTML = '<span class="i" aria-hidden="true">📍</span>Report';
  nv.insertBefore(a, nv.querySelector('a[href^="Creeks.html#about"]'));
}
reportNav(); LK.onChange(reportNav);
loadReports();
LK.onChange(function () { applyLookups(); if (REPORTS === null) loadReports(); if (DATA) draw(); });   // edited lookups/ files
setInterval(function () { load(); loadReports(); }, REFRESH_MIN * 60000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
setInterval(function () { if (DATA) draw(); }, 60000);   // keep "x min ago" current
</script>
</body>
</html>

# Reads San Bruno Creek readings from OneRain's public sensor pages every 5 minutes, and every public
# OneRain site every 15 minutes, and publishes them for the kiosk, the phone pages and the site maps.
#   sanbruno.json - San Bruno Creek stage and rain (kiosk "San Bruno Creek" tab, SanBrunoCreekMobile.html)
#   sites.json    - every public site: location, latest readings, last 24 hours (SiteMap.html, kiosk "Map" tab)
#
# The data goes to a separate branch called "data", replaced on every run, so this
# job doesn't fill your main branch with commits. The kiosk reads:
#   https://raw.githubusercontent.com/<owner>/<repo>/data/sanbruno.json  (and .../data/sites.json)
#
# GitHub runs scheduled jobs "about" every 5 minutes; during busy periods runs can be
# delayed or skipped. You can also run it by hand: Actions tab > Fetch OneRain data > Run workflow.

name: Fetch OneRain data

on:
  schedule:
    # Every 5 minutes, offset from :00/:05/:10... because GitHub delays jobs at those busy minutes.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onerain-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the script
        uses: actions/checkout@v5

      - name: Get the previous data (kept if a download fails)
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:sanbruno.json > out/sanbruno.json 2>/dev/null || true
            git show FETCH_HEAD:sites.json > out/sites.json 2>/dev/null || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download from OneRain
        run: python scripts/fetch_onerain.py out/sanbruno.json

      - name: Download all sites for the map (every 15 minutes)
        # A problem here never stops the creek data from being published.
        continue-on-error: true
        run: python scripts/fetch_sites.py out/sites.json --min-age 14

      - name: Publish to the data branch
        run: |
          cd out
          git init -q
          git checkout -q -b data
          [ -s sites.json ] || rm -f sites.json
          git add sanbruno.json $( [ -f sites.json ] && echo sites.json )
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "OneRain data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

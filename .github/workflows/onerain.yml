# Reads creek readings from OneRain's public sensor pages every 5 minutes, and every public
# OneRain site every 15 minutes, and publishes them for the kiosk, the phone pages and the site maps.
#   creeks.json   - creek stage and rain for the creeks in lookups/creeks.csv and lookups/creek_gauges.csv (kiosk Creeks tab, Creeks.html, home page)
#   status_log.csv - creek status changes (creek status layer, staff review), newest last
#   sites.json    - every public site: location, latest readings, last 24 hours (SiteMap.html, kiosk "Map" tab)
#
# The data goes to a separate branch called "data", replaced on every run, so this
# job doesn't fill your main branch with commits. The kiosk reads:
#   https://raw.githubusercontent.com/<owner>/<repo>/data/creeks.json  (and .../data/sites.json)
#
# GitHub runs scheduled jobs "about" every 5 minutes; during busy periods runs can be
# delayed or skipped. You can also run it by hand: Actions tab > Fetch OneRain data > Run workflow.

name: Fetch OneRain data

on:
  schedule:
    # Every 5 minutes, offset from :00/:05/:10... because GitHub delays jobs at those busy minutes.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onerain-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the script
        uses: actions/checkout@v5

      - name: Get the previous data (kept if a download fails)
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:creeks.json > out/creeks.json 2>/dev/null \
              || git show FETCH_HEAD:sanbruno.json > out/creeks.json 2>/dev/null || true
            git show FETCH_HEAD:sites.json > out/sites.json 2>/dev/null || true
            git show FETCH_HEAD:status_log.csv > out/status_log.csv 2>/dev/null || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download from OneRain
        run: python scripts/fetch_onerain.py out/creeks.json

      - name: Download all sites for the map (every 15 minutes)
        # A problem here never stops the creek data from being published.
        continue-on-error: true
        run: python scripts/fetch_sites.py out/sites.json --min-age 14

      - name: Publish to the data branch
        run: |
          cd out
          git init -q
          git checkout -q -b data
          [ -s sites.json ] || rm -f sites.json
          cp creeks.json sanbruno.json   # older name, kept so pages not yet updated keep working
          git add creeks.json sanbruno.json $( [ -f sites.json ] && echo sites.json ) $( [ -f status_log.csv ] && echo status_log.csv )
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "OneRain data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: Check the lookups/ files (creeks, gauges, thresholds, tide stations)
        # Runs after publishing, so a typo never stops the creek readings. If a file has a mistake the data job
        # keeps the last good settings, and this step marks the run as failed and lists the row and problem.
        if: always()
        run: |
          if [ -s out/settings_problems.txt ]; then
            echo "::error title=lookups::A file in lookups/ has a mistake; the pages are using the last good settings."
            cat out/settings_problems.txt
            exit 1
          fi

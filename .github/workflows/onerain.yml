# Reads creek readings from OneRain's public sensor pages every 5 minutes, and every public
# OneRain site every 15 minutes, and publishes them for the kiosk, the phone pages and the site maps.
#   creeks.json   - creek stage and rain for the creeks in lookups/creeks.csv and lookups/creek_gauges.csv (kiosk Creeks tab, Creeks.html, home page)
#   creeks_7day.json - every creek sensor's readings for the last 7 days, built up run by run (for the data archive,
#                   OneShorelineSMC/fews-data-archive); points are [Pacific time, value, UTC time, (USGS codes)]
#   status_log.csv - creek status changes (creek status layer, staff review), newest last
#   tide_tracker.json + tide_tracker_history.json - the water year at four NOAA tide gauges against the tide table and history (TideTracker.html)
#   storm_tracker.json - each rain event at each creek and a season summary per creek (StormTracker.html)
#   sfcjpa.json   - San Francisquito Creek from SFCJPA's Contrail site: the Palo Alto gauges, Mayfield Slough tide, upper-creek
#                   flows and rain (SanFrancisquito.html, preview); only once the CONTRAIL_USER / CONTRAIL_PASSWORD variables are set
#   road_closures.json - road closures from flooding and storms in San Mateo County (Caltrans and city posts), logged for the water year (StormTracker.html)
#   alert_review.json + alert_review.csv - each rain or rising-fast alert (full status above the public one) checked against the flood levels that followed (StormTracker.html)
#   rrfs_review.json + rrfs_review.csv - each storm's RRFS forecasts (6 and 24 hours ahead) against the creek's main rain gauge (StormTracker.html)
#   rrfs.json + rrfs_log.csv - the RRFS model rain forecast (AQPI / CW3E) for each creek's watershed and the watersheds without a creek gauge, staff view only (Creeks.html?preview=1, RainForecast.html)
#   atlas14_watersheds.json - NOAA Atlas 14 at a point in each watershed without a creek gauge (fetched once, a few per run)
#   outlet_tides.json + outlet_tides_log.csv - NOAA's Bay model (SFBOFS) at each creek outlet, staff beta (OutletTides.html)
#   sites.json    - every public site: location, latest readings, last 24 hours (SiteMap.html, kiosk "Map" tab)
#   community_flood_reports.json + community_flood_reports/*.jpg - flood reports APPROVED BY STAFF in ArcGIS (SiteMap.html), every 15 minutes;
#                   only once set up (COMMUNITY_FLOOD_REPORTS_SETUP.md: ARCGIS_API_KEY secret, REPORTS_* variables)
#
# The data goes to a separate branch called "data", replaced on every run, so this
# job doesn't fill your main branch with commits. The kiosk reads:
#   https://raw.githubusercontent.com/<owner>/<repo>/data/creeks.json  (and .../data/sites.json)
#
# GitHub runs scheduled jobs "about" every 5 minutes; during busy periods runs can be
# delayed or skipped. You can also run it by hand: Actions tab > Fetch OneRain data > Run workflow.

name: Fetch OneRain data

on:
  schedule:
    # Every 5 minutes, offset from :00/:05/:10... because GitHub delays jobs at those busy minutes.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onerain-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the script
        uses: actions/checkout@v5
        with:
          # Don't leave the job's GitHub token in .git/config, where any later step's script could read it. The data
          # branch is read anonymously (the repo is public) and pushed with the token given only in the publish step.
          persist-credentials: false

      - name: Get the previous data (kept if a download fails)
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:creeks.json > out/creeks.json 2>/dev/null \
              || git show FETCH_HEAD:sanbruno.json > out/creeks.json 2>/dev/null || true
            git show FETCH_HEAD:sites.json > out/sites.json 2>/dev/null || true
            git show FETCH_HEAD:status_log.csv > out/status_log.csv 2>/dev/null || true
            git show FETCH_HEAD:creeks_7day.json > out/creeks_7day.json 2>/dev/null || true
            git show FETCH_HEAD:tide_offset.json > out/tide_offset.json 2>/dev/null || true
            git show FETCH_HEAD:outlet_tides.json > out/outlet_tides.json 2>/dev/null || true
            git show FETCH_HEAD:outlet_tides_log.csv > out/outlet_tides_log.csv 2>/dev/null || true
            git show FETCH_HEAD:tide_tracker.json > out/tide_tracker.json 2>/dev/null || true
            git show FETCH_HEAD:tide_tracker_history.json > out/tide_tracker_history.json 2>/dev/null || true
            git show FETCH_HEAD:storm_tracker.json > out/storm_tracker.json 2>/dev/null || true
            git show FETCH_HEAD:waves.json > out/waves.json 2>/dev/null || true
            git show FETCH_HEAD:rrfs.json > out/rrfs.json 2>/dev/null || true
            git show FETCH_HEAD:rrfs_log.csv > out/rrfs_log.csv 2>/dev/null || true
            git show FETCH_HEAD:rrfs_review.json > out/rrfs_review.json 2>/dev/null || true
            git show FETCH_HEAD:atlas14_watersheds.json > out/atlas14_watersheds.json 2>/dev/null || true
            git show FETCH_HEAD:road_closures.json > out/road_closures.json 2>/dev/null || true
            git show FETCH_HEAD:sfcjpa.json > out/sfcjpa.json 2>/dev/null || true
            git show FETCH_HEAD:community_flood_reports.json > out/community_flood_reports.json 2>/dev/null || rm -f out/community_flood_reports.json
            git archive FETCH_HEAD community_flood_reports 2>/dev/null | tar -x -C out 2>/dev/null || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download from OneRain
        run: python scripts/fetch_onerain.py out/creeks.json

      - name: Storm tracker (staff page; scripts/storm_tracker.py)
        # Each rain event at each creek (rain, how rare, the creek's response, and the tide at the creek's NOAA gauge) and a
        # season summary per creek, kept in storm_tracker.json from the fresh creeks.json. NOAA's tide is read at most hourly
        # (3 gauges). A problem here never stops the creek data.
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/storm_tracker.py out/creeks.json out/storm_tracker.json --tide-tracker out/tide_tracker.json

      - name: Road closures from storms (Storm Tracker; scripts/road_closures.py, every 10 minutes)
        # San Mateo County state highway closures from flooding, slides, washouts and other storm damage, from the Caltrans
        # Lane Closure System (District 4), and cities' closure posts
        # (lookups/city_feeds.csv). No key needed; about 4 small requests per run. A problem here never stops the
        # creek data; the last log is kept.
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/road_closures.py out/road_closures.json --min-age 9

      - name: San Francisquito Creek from SFCJPA (preview page; scripts/fetch_sfcjpa.py, every 10 minutes)
        # SFCJPA's own OneRain site (contrail.onerain.com): the three Palo Alto gauges, the Mayfield Slough tide, the upper-creek
        # flows and rain, for SanFrancisquito.html. Signs in with SFCJPA's published viewer login, kept as secrets; skipped
        # until they're set. A problem here never stops the creek data; the last readings are kept.
        continue-on-error: true
        timeout-minutes: 3
        env:
          # SFCJPA's public viewer login (published on their website): repository variables, or secrets if you prefer
          CONTRAIL_USER: ${{ vars.CONTRAIL_USER || secrets.CONTRAIL_USER }}
          CONTRAIL_PASSWORD: ${{ vars.CONTRAIL_PASSWORD || secrets.CONTRAIL_PASSWORD }}
        run: |
          if [ -n "$CONTRAIL_USER" ]; then python scripts/fetch_sfcjpa.py out/sfcjpa.json --min-age 9; else echo "CONTRAIL_USER not set; skipped"; fi

      - name: Download all sites for the map (every 15 minutes)
        # A problem here never stops the creek data from being published.
        continue-on-error: true
        run: python scripts/fetch_sites.py out/sites.json --min-age 14

      - name: Bay offset vs the tide table (once a day; scripts/tide_offset.py)
        # The last month's average of measured minus tide table at each NOAA tide station, which the tide pages add to
        # the tide table after the NOAA projection ends. A problem here never stops the creek data; the last values are kept.
        continue-on-error: true
        run: python scripts/tide_offset.py out/tide_offset.json

      - name: Bay model at the creek outlets (staff beta; scripts/outlet_tides.py)
        # NOAA's San Francisco Bay model (SFBOFS) at the mesh point nearest each creek outlet, for the staff page
        # (OutletTides.html). Looks for a new model run every 30 minutes (NOAA publishes one every 6 hours) and reads only
        # the water level at those points. A problem here never stops the creek data; the last values are kept.
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/outlet_tides.py out/outlet_tides.json out/outlet_tides_log.csv --min-age 30

      - name: Tide tracker for the water year (staff page; scripts/tide_tracker.py, hourly)
        # What the water did this season at Redwood City, Alameda, San Francisco and Monterey against the tide table, the
        # levels in lookups/tide_tracker_levels.csv and each gauge's history (NOAA's high/low record, filled in a few years
        # per run). For TideTracker.html. A problem here never stops the creek data; the last values are kept.
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/tide_tracker.py out/tide_tracker.json out/tide_tracker_history.json --min-age 55

      - name: Waves off the coast (Coastside Tides page; scripts/waves.py, every 30 minutes)
        # The Half Moon Bay and San Francisco NOAA buoys and the NWS Coastal Waters Forecast for the waters off San Mateo
        # County. NOAA's tide table leaves waves out. Also the experimental runup estimate for the staff view (reference beaches in
        # lookups/runup_beaches.csv). A problem here never stops the creek data; the last values are kept.
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/waves.py out/waves.json --min-age 25

      - name: Review of the rain and rising-fast alerts (Storm Tracker; scripts/alert_review.py)
        # Since 2026-11-20 the staff view shows the same flood-level status as the public pages; the full status (rain
        # ratings, rising fast) is still worked out and logged in status_log.csv. This checks each of those alerts against
        # the flood levels that followed. A problem here never stops the creek data.
        continue-on-error: true
        timeout-minutes: 1
        run: python scripts/alert_review.py out/status_log.csv out/alert_review.json --creeks out/creeks.json

      - name: RRFS rain forecast from AQPI / CW3E (staff view; scripts/rrfs.py, every 20 minutes)
        # The RRFS model's rain in each hour (out to 3.5 days) and each 15 minutes (out to 18 hours), averaged over each
        # creek's watershed, for the Creeks page staff view (?preview=1); never the kiosks, never a creek's status. Each new
        # run is logged in rrfs_log.csv to check against the gauges after storms. A problem here never stops the creek data.
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/rrfs.py out/rrfs.json --creeks out/creeks.json --min-age 20

      - name: RRFS forecast vs the rain gauges (Storm Tracker; scripts/rrfs_review.py)
        # Each storm's forecasts from 6 and 24 hours ahead (rrfs_log.csv) against the creek's main rain gauge
        # (storm_tracker.json), and Heavy forecasts with no storm. A problem here never stops the creek data.
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/rrfs_review.py out/storm_tracker.json out/rrfs_log.csv out/rrfs_review.json --creeks out/creeks.json

      - name: Flood reports approved by staff (every 15 minutes)
        # A problem here never stops the creek data from being published; the last published reports are kept.
        continue-on-error: true
        env:
          ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}
          REPORTS_LAYER_URL: ${{ vars.REPORTS_LAYER_URL }}
          REPORTS_STAFF_EDITORS: ${{ vars.REPORTS_STAFF_EDITORS }}
        run: |
          if [ -n "$ARCGIS_API_KEY" ] && [ -n "$REPORTS_LAYER_URL" ]; then pip install --quiet pillow==11.0.0; fi
          python scripts/fetch_community_flood_reports.py out --min-age 14

      - name: Publish to the data branch
        run: |
          cd out
          git init -q
          git checkout -q -b data
          [ -s sites.json ] || rm -f sites.json
          cp creeks.json sanbruno.json   # older name, kept so pages not yet updated keep working
          git add creeks.json sanbruno.json $( [ -f sites.json ] && echo sites.json ) $( [ -f status_log.csv ] && echo status_log.csv ) $( [ -s creeks_7day.json ] && echo creeks_7day.json ) $( [ -s tide_offset.json ] && echo tide_offset.json ) \
            $( [ -s outlet_tides.json ] && echo outlet_tides.json ) $( [ -s outlet_tides_log.csv ] && echo outlet_tides_log.csv ) \
            $( [ -s tide_tracker.json ] && echo tide_tracker.json ) $( [ -s tide_tracker_history.json ] && echo tide_tracker_history.json ) \
            $( [ -s storm_tracker.json ] && echo storm_tracker.json ) $( [ -s waves.json ] && echo waves.json ) $( [ -s rrfs.json ] && echo rrfs.json ) $( [ -s rrfs_log.csv ] && echo rrfs_log.csv ) $( [ -s atlas14_watersheds.json ] && echo atlas14_watersheds.json ) $( [ -s alert_review.json ] && echo alert_review.json alert_review.csv ) $( [ -s rrfs_review.json ] && echo rrfs_review.json rrfs_review.csv ) $( [ -s road_closures.json ] && echo road_closures.json ) $( [ -s sfcjpa.json ] && echo sfcjpa.json ) \
            $( [ -s community_flood_reports.json ] && echo community_flood_reports.json ) $( [ -d community_flood_reports ] && [ -n "$(ls -A community_flood_reports)" ] && echo community_flood_reports )
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "OneRain data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: Storm mode (San Bruno and Belmont about every minute while it rains there; fetch_onerain.py --fast)
        # San Bruno and Belmont Creeks are flashy (staff, 2026-11-18: San Bruno rose 1.2 ft in 35 minutes). While it is
        # raining at either one, or either creek is rising, this run keeps going for about 3 more minutes: about every
        # minute it re-reads just those two creeks' gauges, updates creeks.json (readings, signals, statuses) and
        # republishes it. The next scheduled run carries on from there. Stops as soon as there is no rain or rise
        # (exit 3), and a problem here never touches the data the run already published.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          end=$(( $(date +%s) + 190 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 45
            set +e
            python scripts/fetch_onerain.py out/creeks.json --fast sanbruno,belmont
            code=$?
            set -e
            if [ "$code" -eq 3 ]; then break; fi
            if [ "$code" -ne 0 ]; then continue; fi
            (
              cd out
              cp creeks.json sanbruno.json
              git add creeks.json sanbruno.json $( [ -f status_log.csv ] && echo status_log.csv )
              git -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -q --amend -m "OneRain data $(date -u +%Y-%m-%dT%H:%MZ) (storm mode)"
              git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
            ) || echo "storm mode: publish failed; the next run publishes"
          done

      - name: Check the lookups/ files (creeks, gauges, thresholds, tide stations)
        # Runs after publishing, so a typo never stops the creek readings. If a file has a mistake the data job
        # keeps the last good settings, and this step marks the run as failed and lists the row and problem.
        if: always()
        run: |
          if [ -s out/settings_problems.txt ]; then
            echo "::error title=lookups::A file in lookups/ has a mistake; the pages are using the last good settings."
            cat out/settings_problems.txt
            exit 1
          fi

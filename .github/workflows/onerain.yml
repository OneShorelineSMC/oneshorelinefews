# Reads creek readings from OneRain's public sensor pages every 5 minutes, and every public
# OneRain site every 15 minutes, and publishes them for the kiosk, the phone pages and the site maps.
#   creeks.json   - creek stage and rain for the creeks in lookups/creeks.csv and lookups/creek_gauges.csv (kiosk Creeks tab, Creeks.html, home page)
#   creeks_7day.json - every creek sensor's readings for the last 7 days, built up run by run (for the data archive,
#                   OneShorelineSMC/fews-data-archive); points are [Pacific time, value, UTC time, (USGS codes)]
#   status_log.csv - creek status changes (creek status layer, staff review), newest last
#   sites.json    - every public site: location, latest readings, last 24 hours (SiteMap.html, kiosk "Map" tab)
#   community_flood_reports.json + community_flood_reports/*.jpg - flood reports APPROVED BY STAFF in ArcGIS (SiteMap.html), every 15 minutes;
#                   only once set up (COMMUNITY_FLOOD_REPORTS_SETUP.md: ARCGIS_API_KEY secret, REPORTS_* variables)
#
# The data goes to a separate branch called "data", replaced on every run, so this
# job doesn't fill your main branch with commits. The kiosk reads:
#   https://raw.githubusercontent.com/<owner>/<repo>/data/creeks.json  (and .../data/sites.json)
#
# GitHub runs scheduled jobs "about" every 5 minutes; during busy periods runs can be
# delayed or skipped. You can also run it by hand: Actions tab > Fetch OneRain data > Run workflow.

name: Fetch OneRain data

on:
  schedule:
    # Every 5 minutes, offset from :00/:05/:10... because GitHub delays jobs at those busy minutes.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onerain-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the script
        uses: actions/checkout@v5

      - name: Get the previous data (kept if a download fails)
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:creeks.json > out/creeks.json 2>/dev/null \
              || git show FETCH_HEAD:sanbruno.json > out/creeks.json 2>/dev/null || true
            git show FETCH_HEAD:sites.json > out/sites.json 2>/dev/null || true
            git show FETCH_HEAD:status_log.csv > out/status_log.csv 2>/dev/null || true
            git show FETCH_HEAD:creeks_7day.json > out/creeks_7day.json 2>/dev/null || true
            git show FETCH_HEAD:tide_offset.json > out/tide_offset.json 2>/dev/null || true
            git show FETCH_HEAD:community_flood_reports.json > out/community_flood_reports.json 2>/dev/null || rm -f out/community_flood_reports.json
            git archive FETCH_HEAD community_flood_reports 2>/dev/null | tar -x -C out 2>/dev/null || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download from OneRain
        run: python scripts/fetch_onerain.py out/creeks.json

      - name: Download all sites for the map (every 15 minutes)
        # A problem here never stops the creek data from being published.
        continue-on-error: true
        run: python scripts/fetch_sites.py out/sites.json --min-age 14

      - name: Bay offset vs the tide table (once a day; scripts/tide_offset.py)
        # The last month's average of measured minus tide table at each NOAA tide station, which the tide pages add to
        # the tide table after the NOAA projection ends. A problem here never stops the creek data; the last values are kept.
        continue-on-error: true
        run: python scripts/tide_offset.py out/tide_offset.json

      - name: Flood reports approved by staff (every 15 minutes)
        # A problem here never stops the creek data from being published; the last published reports are kept.
        continue-on-error: true
        env:
          ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}
          REPORTS_LAYER_URL: ${{ vars.REPORTS_LAYER_URL }}
          REPORTS_STAFF_EDITORS: ${{ vars.REPORTS_STAFF_EDITORS }}
        run: |
          if [ -n "$ARCGIS_API_KEY" ] && [ -n "$REPORTS_LAYER_URL" ]; then pip install --quiet pillow==11.0.0; fi
          python scripts/fetch_community_flood_reports.py out --min-age 14

      - name: Publish to the data branch
        run: |
          cd out
          git init -q
          git checkout -q -b data
          [ -s sites.json ] || rm -f sites.json
          cp creeks.json sanbruno.json   # older name, kept so pages not yet updated keep working
          git add creeks.json sanbruno.json $( [ -f sites.json ] && echo sites.json ) $( [ -f status_log.csv ] && echo status_log.csv ) $( [ -s creeks_7day.json ] && echo creeks_7day.json ) $( [ -s tide_offset.json ] && echo tide_offset.json ) \
            $( [ -s community_flood_reports.json ] && echo community_flood_reports.json ) $( [ -d community_flood_reports ] && [ -n "$(ls -A community_flood_reports)" ] && echo community_flood_reports )
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "OneRain data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: Check the lookups/ files (creeks, gauges, thresholds, tide stations)
        # Runs after publishing, so a typo never stops the creek readings. If a file has a mistake the data job
        # keeps the last good settings, and this step marks the run as failed and lists the row and problem.
        if: always()
        run: |
          if [ -s out/settings_problems.txt ]; then
            echo "::error title=lookups::A file in lookups/ has a mistake; the pages are using the last good settings."
            cat out/settings_problems.txt
            exit 1
          fi

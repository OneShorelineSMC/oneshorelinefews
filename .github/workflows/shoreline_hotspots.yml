name: Build shoreline hotspots

# A draft list of the low points on San Mateo County's Bay shoreline: where the Bay comes over the shoreline at 12, 24
# and 36 inches above MHHW (scripts/build_shoreline_lowpoints.py): SFEI's Bay Shore Inventory lines (from BCDC's RSAP
# open data; wetland and channel lines left out) checked against BCDC's Adapting to Rising Tides flooded areas
# (Caltrans map service), or BCDC's own overtopping lines if data/shoreline_overtopping.geojson (a GIS export) is there.
# Writes lookups/proposed/shoreline_hotspots.csv and data/shoreline_hotspots_candidates.geojson for staff review; the
# pages read the reviewed copy, lookups/shoreline_hotspots.csv. Run it by hand (Actions > Build shoreline hotspots >
# Run workflow); about 10 minutes. Commits only if the draft changed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shoreline-hotspots
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the map library
        run: pip install shapely
      - name: Build the draft list
        run: python -u scripts/build_shoreline_lowpoints.py
      - name: Commit if anything changed
        run: |
          git config user.name  "fews-hotspots-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lookups/proposed/shoreline_hotspots.csv data/shoreline_hotspots_candidates.geojson
          if git diff --cached --quiet; then echo "Draft list already up to date."; exit 0; fi
          git commit -q -m "Draft shoreline hotspots (BCDC ART)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

name: Build shoreline hotspots

# A draft list of the low points on San Mateo County's Bay shoreline: where BCDC's Adapting to Rising Tides "shoreline
# overtopping" layer shows the Bay coming over the shoreline at 12, 24 and 36 inches above MHHW
# (scripts/build_shoreline_lowpoints.py). Reads data/shoreline_overtopping.geojson (exported once in GIS from the ART
# geodatabase); writes lookups/proposed/shoreline_hotspots.csv and data/shoreline_hotspots_candidates.geojson for
# staff review. The pages read the reviewed copy, lookups/shoreline_hotspots.csv. Run it by hand (Actions > Build
# shoreline hotspots > Run workflow) after uploading a new export. Commits only if the draft changed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shoreline-hotspots
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the draft list
        run: python -u scripts/build_shoreline_lowpoints.py
      - name: Commit if anything changed
        run: |
          git config user.name  "fews-hotspots-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lookups/proposed/shoreline_hotspots.csv data/shoreline_hotspots_candidates.geojson
          if git diff --cached --quiet; then echo "Draft list already up to date."; exit 0; fi
          git commit -q -m "Draft shoreline hotspots (BCDC ART)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
